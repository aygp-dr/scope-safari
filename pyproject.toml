[project]
name = "scope-safari"
version = "0.1.0"
description = "A cross-language environment exploration project"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Environment Explorer"}
]
dependencies = [
    "pydantic>=2.11.7",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["com"]
